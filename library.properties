name=TinyGsmA7670E
version=1.2.0
author=fwino
maintainer=mhmdrameez <31467986+mhmdrameez@users.noreply.github.com>
sentence=TinyGSM modem driver for the SIMCom A7670E (LTE Cat-1).
paragraph=Socket (TCP) driver with NETOPEN settle delay and CIPOPEN retries, one-call LTE/2G connect with fallback, strict LTE-only mode, battery/brownout diagnostics that tell a power problem from a modem problem, plus a raw HTTP helper that sends the same bytes as curl. Needs TinyGSM 0.12.x.
category=Communication
